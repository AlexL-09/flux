# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: install virtual display for client integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
      - name: client integration tests
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: xvfb-run -a ./gradlew runClientGameTest
      - name: capture test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Test-evidence
          path: |
            build/reports/tests/
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
            build/run/clientGameTest/flux-performance.txt
